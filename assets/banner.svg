<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="borakove — offensive security terminal">
<title>borakove // offensive security</title>
<!-- recon is half the battle. T0VYe2UzcDBhXzFmX3U0eXNfZ3UzX280Z2d5M30= -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070a"/><stop offset="1" stop-color="#0b1117"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#39ff14"/><stop offset=".5" stop-color="#00e5ff"/><stop offset="1" stop-color="#39ff14"/>
  </linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#ffffff" opacity=".035"/>
  </pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<style>
  text { font-family: 'JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,'Courier New',monospace; font-size: 15px; white-space: pre; }
  .logo { font-size: 64px; font-weight: 800; letter-spacing: 10px; }
  .sub  { font-size: 13px; letter-spacing: 4px; fill: #5c6773; }
  .hex  text { font-size: 11px; fill: #1f3a2a; }
  .g1 { animation: g1 3.2s infinite steps(1); }
  .g2 { animation: g2 3.2s infinite steps(1); }
  .cursor { animation: blink 1s infinite steps(1); }
  .sweep { animation: sweep 6s linear infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes g1 {
    0%,86%,100% { transform: translate(0,0); opacity: 0; }
    88% { transform: translate(-6px,-2px); opacity: .9; }
    91% { transform: translate(5px,1px); opacity: .9; }
    94% { transform: translate(-3px,2px); opacity: .9; }
  }
  @keyframes g2 {
    0%,86%,100% { transform: translate(0,0); opacity: 0; }
    88% { transform: translate(6px,2px); opacity: .9; }
    91% { transform: translate(-5px,-1px); opacity: .9; }
    94% { transform: translate(3px,-2px); opacity: .9; }
  }
  @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(510px); } }
</style>

<rect width="1000" height="470" rx="14" fill="url(#bg)"/>
<rect x=".5" y=".5" width="999" height="469" rx="14" fill="none" stroke="#1b2a22"/>

<!-- window chrome -->
<circle cx="26" cy="22" r="6" fill="#ff5f56"/><circle cx="46" cy="22" r="6" fill="#ffbd2e"/><circle cx="66" cy="22" r="6" fill="#27c93f"/>
<text x="500.0" y="27" text-anchor="middle" style="font-size:12px" fill="#5c6773">borakove@kali: ~/ops — zsh — 1337×42</text>
<line x1="0" y1="42" x2="1000" y2="42" stroke="#16211b"/>

<g class="hex"><text x="800" y="150">7ffd1337  bb 54 aa c4</text><text x="800" y="168">7ffd1347  b8 9d c8 68</text><text x="800" y="186">7ffd1357  ba 37 d9 cc</text><text x="800" y="204">7ffd1367  21 b2 ce ce</text><text x="800" y="222">7ffd1377  9f 09 b4 3c</text><text x="800" y="240">7ffd1387  eb 7e 57 a0</text><text x="800" y="258">7ffd1397  ea 87 66 22</text><text x="800" y="276">7ffd13a7  16 24 d0 1b</text><text x="800" y="294">7ffd13b7  08 64 64 35</text><text x="800" y="312">7ffd13c7  91 64 e7 a0</text><text x="800" y="330">7ffd13d7  06 aa dd 75</text><text x="800" y="348">7ffd13e7  17 9d 6d 5c</text><text x="800" y="366">7ffd13f7  5e 19 fd e9</text><text x="800" y="384">7ffd1407  0c f9 b4 83</text><text x="800" y="402">7ffd1417  86 22 42 1e</text><text x="800" y="420">7ffd1427  57 a1 28 62</text></g>

<!-- glitch logo -->
<g>
  <text x="36" y="118" class="logo" fill="#39ff14" filter="url(#blur)" opacity=".35">BORAKOVE</text>
  <text x="36" y="118" class="logo g1" fill="#00e5ff">BORAKOVE</text>
  <text x="36" y="118" class="logo g2" fill="#ff2bd6">BORAKOVE</text>
  <text x="36" y="118" class="logo" fill="url(#glow)">BORAKOVE</text>
  <text x="40" y="146" class="sub">APPSEC · OFFENSIVE SECURITY · EXPLOIT-DRIVEN REMEDIATION</text>
</g>
<line x1="36" y1="166" x2="760" y2="166" stroke="#16211b" stroke-dasharray="2 4"/>

<g>
<text x="36" y="196" opacity="0"><tspan fill="#00e5ff">┌──(</tspan><tspan fill="#39ff14">borakove</tspan><tspan fill="#d7dde4">@</tspan><tspan fill="#39ff14">kali</tspan><tspan fill="#00e5ff">)-[</tspan><tspan fill="#d7dde4">~/ops</tspan><tspan fill="#00e5ff">]</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0187;0.0194;1" dur="16.0s" repeatCount="indefinite"/></text>
<clipPath id="c1"><rect x="34" y="203" height="22" width="0"><animate attributeName="width" values="0;0;36.1;36.1;200.6;200.6" keyTimes="0;0.0312;0.0319;0.0406;0.1156;1" dur="16.0s" repeatCount="indefinite"/></rect></clipPath><text x="36" y="218" clip-path="url(#c1)"><tspan fill="#00e5ff">└─$ </tspan><tspan fill="#d7dde4">whoami --verbose</tspan></text>
<text x="36" y="240" opacity="0"><tspan fill="#39ff14">[+] </tspan><tspan fill="#d7dde4">Application Security Engineer  //  Penetration Tester  //  Researcher</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1250;0.1256;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="36" y="262" opacity="0"><tspan fill="#39ff14">[+] </tspan><tspan fill="#5c6773">10+ yrs  ·  50+ engagements  ·  web · api · mobile · AD · LLM/RAG</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1437;0.1444;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="36" y="284" opacity="0"><tspan fill="#00e5ff">┌──(</tspan><tspan fill="#39ff14">borakove</tspan><tspan fill="#d7dde4">@</tspan><tspan fill="#39ff14">kali</tspan><tspan fill="#00e5ff">)-[</tspan><tspan fill="#d7dde4">~/ops</tspan><tspan fill="#00e5ff">]</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1875;0.1881;1" dur="16.0s" repeatCount="indefinite"/></text>
<clipPath id="c5"><rect x="34" y="291" height="22" width="0"><animate attributeName="width" values="0;0;36.1;36.1;408.3;408.3" keyTimes="0;0.2000;0.2006;0.2094;0.3344;1" dur="16.0s" repeatCount="indefinite"/></rect></clipPath><text x="36" y="306" clip-path="url(#c5)"><tspan fill="#00e5ff">└─$ </tspan><tspan fill="#d7dde4">./chain --from upload --to domain-admin</tspan></text>
<text x="36" y="328" opacity="0"><tspan fill="#ffd84d">[*] </tspan><tspan fill="#d7dde4">upload ─▶ rce ─▶ pivot ─▶ privesc ─▶ </tspan><tspan fill="#ff4d4d">DOMAIN ADMIN</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3500;0.3506;1" dur="16.0s" repeatCount="indefinite"/></text>
<text x="36" y="350" opacity="0"><tspan fill="#39ff14">[✓] </tspan><tspan fill="#39ff14">chain validated. writing report + remediation plan...</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3937;0.3944;1" dur="16.0s" repeatCount="indefinite"/></text>
<g opacity="0"><text x="36" y="372"><tspan fill="#00e5ff">└─$ </tspan></text><rect class="cursor" x="72.1" y="359" width="9.0" height="16" fill="#39ff14"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4375;0.4381;1" dur="16.0s" repeatCount="indefinite"/></g>
</g>

<!-- CRT overlay -->
<rect width="1000" height="470" rx="14" fill="url(#scan)" pointer-events="none"/>
<rect class="sweep" x="0" y="0" width="1000" height="40" fill="#39ff14" opacity=".03"/>
</svg>
