<text x="24" y="135" opacity="0" class="mono"><tspan fill="#6b7785">  hint 1 : </tspan><tspan fill="#d7dde4">recon is half the battle. what you see is not all that&#x27;s served.</tspan><animate attributeName="opacity" values="0;0;1;1" keyTimes="0.00000;0.12552;0.12865;1.00000" dur="16.00s" repeatCount="indefinite"/></text>
